{% extends 'catalogo/base.html' %}

{% block title %}Crear cuenta | Ferretería{% endblock %}

{% block content %}
<section class="panel">
    <h2>Crear cuenta de cliente</h2>
    <p>Regístrate para enviar consultas sobre nuestros productos.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Crear cuenta</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="{% url 'iniciar_sesion' %}">Inicia sesión</a>.</p>
</section>
{% endblock %}
